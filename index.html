<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#1e1e1e" />
  <!-- Pick the theme before first paint (stored choice, else the system setting) so there is no flash -->
  <script>(function () { var t = null; try { t = localStorage.getItem('lab.theme'); } catch (e) {} if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; document.documentElement.dataset.theme = t; })();</script>
  <title>Wooden Labyrinth</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231e1e1e'/%3E%3Cg fill='none' stroke='%235e6ad2' stroke-width='2.5'%3E%3Ccircle cx='16' cy='16' r='12'/%3E%3Ccircle cx='16' cy='16' r='6.5'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='2' fill='%23f7f8f8'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="stage" role="img" aria-label="A round wooden labyrinth with steel balls in its circular grooves"></div>

  <header id="hud" class="hud">
    <div id="timer" class="timer" aria-label="Elapsed time">0:00.0</div>
    <nav class="hud-buttons" aria-label="Game">
      <button id="btn-calibrate" type="button" hidden>Calibrate</button>
      <button id="btn-pause" type="button" aria-pressed="false" title="Pause (P)">Pause</button>
      <button id="btn-reset" type="button" title="Restart (R)">Restart</button>
      <button type="button" class="icon-btn" data-theme-toggle title="Light / dark"><svg class="i-sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.4 1.4M11.55 11.55l1.4 1.4M3.05 12.95l1.4-1.4M11.55 4.45l1.4-1.4"/></svg><svg class="i-moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.8A5.8 5.8 0 0 1 6.2 2.5a5.8 5.8 0 1 0 7.3 7.3z"/></svg></button>
    </nav>
  </header>

  <div id="joystick" class="joystick" hidden aria-label="Tilt joystick">
    <div class="joy-ring" aria-hidden="true"><span></span></div>
    <div id="joy-knob" class="joy-knob" aria-hidden="true"></div>
  </div>

  <section id="hero" class="hero" aria-labelledby="hero-title">
    <div class="hero-glow" aria-hidden="true"></div>
    <div class="hero-rails" aria-hidden="true"></div>
    <nav class="hero-nav bleed"><span class="hero-mark">Labyrinth</span><span class="hero-nav-end"><span class="hero-tag">v1.0</span><button type="button" class="icon-btn" data-theme-toggle title="Light / dark"><svg class="i-sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.4 1.4M11.55 11.55l1.4 1.4M3.05 12.95l1.4-1.4M11.55 4.45l1.4-1.4"/></svg><svg class="i-moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.8A5.8 5.8 0 0 1 6.2 2.5a5.8 5.8 0 1 0 7.3 7.3z"/></svg></button></span></nav>
    <div class="hero-body bleed top">
      <span class="cross tl" aria-hidden="true"></span><span class="cross tr" aria-hidden="true"></span>
      <span class="cross bl" aria-hidden="true"></span><span class="cross br" aria-hidden="true"></span>
      <div class="hero-copy">
        <span class="hero-label">A tilt maze in your browser</span>
        <h1 id="hero-title">Tilt the board.<br /><span>Find the centre.</span></h1>
        <p class="hero-lead">Guide three steel balls through a handcrafted wooden maze. No time limit, just you and the clock.</p>
        <div class="hero-actions">
          <button id="btn-hero" type="button" class="primary start">Play now <span aria-hidden="true">&rarr;</span></button>
          <span class="hero-hint"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>&nbsp;to tilt, or tilt your phone</span>
        </div>
      </div>
      <!-- Empty on purpose: the live 3D board behind the page is framed inside this column -->
      <div id="hero-visual" class="hero-visual" aria-hidden="true"><span class="cross vt"></span><span class="cross vb"></span></div>
    </div>
    <div class="hero-foot bleed top">
      <div><b>03</b>Steel balls</div>
      <div><b>03</b>Rings to pass</div>
      <div><b>&infin;</b>No time limit</div>
    </div>
  </section>

  <div id="pause" class="overlay" hidden>
    <button id="btn-resume" type="button" class="primary start">Resume</button>
  </div>

  <div id="win" class="overlay" hidden role="dialog" aria-labelledby="win-title">
    <div class="result">
      <p id="win-title" class="result-time">Solved in <span id="win-time"></span></p>
      <button id="btn-again" type="button" class="primary start">Play again</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="error" class="overlay" hidden>
    <div class="result"><h2 id="error-title">Something went wrong</h2><p id="error-detail"></p></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
